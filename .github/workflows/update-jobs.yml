name: Update live jobs

on:
  schedule:
    # 08:15 India time (02:45 UTC) every day.
    - cron: "45 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-live-jobs
  cancel-in-progress: false

jobs:
  update:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate verified live jobs page
        shell: powershell
        run: |
          ./tools/Update-Notice.ps1 `
            -WebJobsUrl "https://ankusa.github.io/sanetkendra/" `
            -NoOpen
          Copy-Item ./tools/WEB-JOBS/index.html ./index.html -Force

      - name: Publish only when the page changed
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html tools/JOB-LINKS.json tools/JOB-VACANCIES.json
          if (git diff --cached --quiet) {
            Write-Host "No changes to publish."
            exit 0
          }
          git commit -m "Auto-update verified jobs"
          git push
